html <!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>CEO-Pulse Sovereign Executive</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"> <style> :root { --bg: #050d25; --card-bg: #0d1b3e; --card-border: #1e3366; --accent: #00e5ff; --accent-glow: rgba(0, 229, 255, 0.35); --purple: #8b5cf6; --emerald: #10b981; --rose: #f43f5e; --amber: #f59e0b; --text: #f8fafc; --text-dim: #94a3b8; } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'Cairo', sans-serif; background: #050d25; color: var(--text); min-height: 100vh; padding-bottom: 85px; } /* Floating Toast */ #toastMsg { position: fixed; top: 15px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0d1b3e; border: 1px solid var(--accent); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; z-index: 999999; box-shadow: 0 4px 20px var(--accent-glow); transition: transform 0.3s ease; pointer-events: none; white-space: nowrap; } #toastMsg.show { transform: translateX(-50%) translateY(0); } /* External Lock Screen */ #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050d25; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; } .lock-shield { width: 70px; height: 70px; border-radius: 50%; background: rgba(0,229,255,0.15); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 14px; box-shadow: 0 0 20px var(--accent-glow); } .pin-dots { display: flex; gap: 12px; margin: 18px 0 24px; } .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--card-border); transition: all 0.15s ease; } .pin-dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent); } .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; } .key-btn { background: #0d1b3e; border: 1px solid var(--card-border); color: #fff; font-size: 22px; font-weight: 700; border-radius: 16px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; } .key-btn:active { background: var(--accent); color: #050d25; } /* Top Sovereign Bar */ .top-bar { position: sticky; top: 0; z-index: 1000; background: #050d25; border-bottom: 1px solid var(--card-border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; } .brand { display: flex; align-items: center; gap: 8px; } .brand-logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 16px; } .brand-title { font-size: 15px; font-weight: 800; } .brand-sub { font-size: 9px; color: var(--accent); font-weight: 600; } .top-actions { display: flex; align-items: center; gap: 6px; style="font-size: 13px; font-weight: 700;">اضغط لاختيار سيرة ذاتية PDF</div> <input type="file" id="cvFileInput" accept=".pdf,.docx,.doc" style="display: none;" onchange="handleCvUpload(event)"> <button type="button" class="btn-primary" style="margin-top: 10px; max-width: 200px; margin-inline: auto;" onclick="document.getElementById('cvFileInput').click()"> رفع ملف السيرة الذاتية </button> </div> <div id="cvScanResult" style="display: none; background: rgba(5, 13, 37, 0.7); border: 1px solid var(--accent); border-radius: 12px; padding: 12px;"> <div style="font-weight: 800; font-size: 13px; color: var(--accent); margin-bottom: 4px;">نتيجة فحص السيرة الذاتية بالذكاء الاصطناعي:</div> <div style="font-size: 12px;">المرشح: <strong id="resCandidate">مهندس برمجيات ونظم</strong></div> <div style="font-size: 12px; margin: 4px 0;">نسبة التطابق مع معايير الشركة: <strong style="color: var(--emerald);">96% (موصى بالتعيين)</strong></div> <div style="font-size: 11px; color: var(--text-dim);">التدقيق الجنائي: تم فحص السجل المهني والتأمينات والتأكد من صحة الشهادات بنسبة 100%.</div> </div> </div> </section> <!-- 4. DEPARTMENTS TAB --> <section id="tab-departments" class="tab-section"> <div class="pulse-card"> <div class="card-title"> <span>🏢</span> <span>إدارة وهيكلة موظفي الأقسام</span> </div> <div style="display: flex; gap: 6px; margin-bottom: 14px;"> <input type="text" id="newEmpName" placeholder="اسم الموظف الجديد..." class="input-field" style="margin: 0; flex: 2;"> <select id="newEmpDept" class="input-field" style="margin: 0; flex: 1;"> <option value="المالية">المالية</option> <option value="المبيعات">المبيعات</option> <option value="التقنية">التقنية</option> <option value="الموارد البشرية">الموارد البشرية</option> <option value="النظافة والخدمات">النظافة</option> </select> <button type="button" class="action-pill" style="background: var(--accent); color: #050d25;" onclick="addEmployee()">إضافة</button> </div> <div id="employeesList"> <div class="item-row"> <div> <strong>الموظف أ</strong> <div style="font-size: 11px; color: var(--text-dim);">قسم الإدارة المالية</div> </div> <span class="badge-emerald">نشط</span> </div> <div class="item-row"> <div> <strong>الموظف ب</strong> <div style="font-size: 11px; color: var(--text-dim);">قسم الموارد البشرية</div> </div> <span class="badge-emerald">نشط</span> </div> <div class="item-row"> <div> <strong>الموظف ج</strong> <div style="font-size: 11px; color: var(--text-dim);">قسم النظافة والخدمات</div> </div> <span class="badge-emerald">نشط</span> </div> </div> </div> </section> <!-- 5. DEALS & BONUSES TAB --> <section id="tab-deals" class="tab-section"> <div class="pulse-card"> <div class="card-title"> <span>💰</span> <span>الصفقات والمكافآت المعتمدة</span> </div> <div class="item-row"> <div> <div style="font-weight: 700;">الموظف أ (صفقة التوريد الكبرى)</div> <div style="font-size: 11px; color: var(--text-dim);">قيمة الصفقة: 150,000 <span class="curr-tag">SAR</span></div> </div> <span class="badge-emerald">+ 15,000 <span class="curr-tag">SAR</span> مكافأة</span> </div> <div class="item-row"> <div> <div style="font-weight: 700;">الموظف د (إغلاق عقد الصيانة السنوي)</div> <div style="font-size: 11px; color: var(--text-dim);">قيمة الصفقة: 85,000 <span class="curr-tag">SAR</span></div> </div> <span class="badge-emerald">+ 8,500 <span class="curr-tag">SAR</span> مكافأة</span> </div> </div> </section> <!-- 6. SOVEREIGN SECURITY TAB --> <section id="tab-security" class="tab-section"> <div class="pulse-card" style="border-color: var(--purple);"> <div class="card-title" style="color: var(--purple);"> <span>🛡️</span> <span>الحماية السيادية والتشفير الطرفي (E2EE)</span> </div> <div class="item-row"> <span>حالة التشفير العسكري (Kyber-1024 HSM)</span> <span class="badge-emerald">مقاوم للحوسبة الكمومية</span> </div> <div class="item-row"> <span>السحابة المعزولة (Paris Cloud Node)</span> <span class="badge-emerald">PostgreSQL مشفرة</span> </div> <div class="item-row"> <span>صلاحية مفتاح الطوارئ (Kill-Switch)</span> <span class="badge-amber">الرمز الفائق: 9900</span> </div> </div> </section> </main> <!-- Fixed Bottom Navigation Bar --> <nav class="bottom-nav"> <button type="button" class="nav-item active" id="btn-dashboard" onclick="goToTab('dashboard')"> <span class="nav-icon">🏠</span> <span>الرئيسية</span> </button> <button type="button" class="nav-item" id="btn-compliance" onclick="goToTab('compliance')"> <span class="nav-icon">⚖️</span> <span>المخالفات</span> </button> <button type="button" class="nav-item" id="btn-hiring" onclick="goToTab('hiring')"> <span class="nav-icon">🤖</span> <span>التوظيف</span> </button> <button type="button" class="nav-item" id="btn-departments" onclick="goToTab('departments')"> <span class="nav-icon">🏢</span> <span>الأقسام</span> </button> <button type="button" class="nav-item" id="btn-deals" onclick="goToTab('deals')"> <span class="nav-icon">💰</span> <span>الصفقات</span> </button> <button type="button" class="nav-item" id="btn-security" onclick="goToTab('security')"> <span class="nav-icon">🛡️</span> <span>الأمان</span> </button> </nav> <!-- Master Key Modal --> <div class="modal-overlay" id="masterModal"> <div class="modal-card"> <h3 style="color: var(--rose); font-size: 16px; margin-bottom: 6px;">🛡️ خزينة المشرف الفائق (Master Vault)</h3> <p style="font-size: 11px; color: var(--text-dim); margin-bottom: 12px;">أدخل الرمز السري الفائق لإدارة الترخيص أو تجميد التطبيق عن بُعد.</p> <input type="password" id="masterPinInput" placeholder="أدخل رمز المشرف (9900)..." class="input-field"> <div style="display: flex; gap: 8px;"> <button type="button" class="btn-primary" style="background: var(--rose); color: #fff;" onclick="verifyMasterPin()">تحقق من الرمز</button> <button type="button" class="action-pill" onclick="closeMasterModal()">إلغاء</button> </div> </div> </div> <script> function showToast(msg) { const toast = document.getElementById("toastMsg"); if (toast) { toast.innerText = msg; toast.classList.add("show"); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(function() { toast.classList.remove("show"); }, 2200); } } let enteredPin = ""; const correctPin = "1234"; function pressKey(num) { if (enteredPin.length < 4) { enteredPin += num; updateDots(); if (enteredPin.length === 4) { setTimeout(verifyPin, 120); } } } function clearPin() { enteredPin = ""; updateDots(); } function updateDots() { for (let i = 0; i < 4; i++) { const dot = document.getElementById("dot" + i); if (dot) { if (i < enteredPin.length) dot.classList.add("filled"); else dot.classList.remove("filled"); } } } function verifyPin() { if (enteredPin === correctPin) { quickUnlock(); } else { showToast("❌ رمز الدخول غير صحيح!"); clearPin(); } } function quickUnlock() { const lock = document.getElementById("lockScreen"); if (lock) { lock.style.display = "none"; lock.remove(); showToast("🔓 أهلاً بك، تم فتح المنظومة بنجاح"); } } function goToTab(tabName) { const sections = document.querySelectorAll(".tab-section"); for (let i = 0; i < sections.length; i++) { sections[i].classList.remove("active"); sections[i].style.display = "none"; } const target = document.getElementById("tab-" + tabName); if (target) { target.classList.add("active"); target.style.display = "block"; } const navs = document.querySelectorAll(".nav-item"); for (let i = 0; i < navs.length; i++) { navs[i].classList.remove("active"); } const activeBtn = document.getElementById("btn-" + tabName); if (activeBtn) { activeBtn.classList.add("active"); } window.scrollTo(0, 0); } function runPolicyScan() { showToast("🔍 جاري فحص الامتثال الجنائي اللحظي..."); setTimeout(function() { showToast("✅ النتيجة: لم يتم رصد أي تسريب جديد للبيانات!"); }, 700); } function approvePayroll() { showToast("✅ تم اعتماد مسير الرواتب وحفظه بالسحابة!"); } function handleCvUpload(e) { const file = e.target.files[0]; if (file) { const resBox = document.getElementById("cvScanResult"); const candName = document.getElementById("resCandidate"); if (candName) candName.innerText = file.name.replace(/\.[^/.]+$/, ""); if (resBox) resBox.style.display = "block"; showToast("🤖 تم فحص ومطابقة السيرة الذاتية بنجاح!"); } } function addEmployee() { const nameInput = document.getElementById("newEmpName"); const name = nameInput.value.trim(); const dept = document.getElementById("newEmpDept").value; if (!name) { showToast("⚠️ يرجى كتابة اسم الموظف أولاً!"); return; } const list = document.getElementById("employeesList"); const row = document.createElement("div"); row.className = "item-row"; row.innerHTML = "<div><strong>" + name + "</strong><div style='font-size: 11px; color: var(--text-dim);'>قسم " + dept + "</div></div><span class='badge-emerald'>نشط</span>"; list.prepend(row); nameInput.value = ""; showToast("✅ تمت إضافة الموظف بنجاح!"); } function openMasterModal() { document.getElementById("masterModal").classList.add("open"); } function closeMasterModal() { document.getElementById("masterModal").classList.remove("open"); } function verifyMasterPin() { const pin = document.getElementById("masterPinInput").value; if (pin === "9900") { showToast("👑 تم تفعيل صلاحيات المالك المركزي 9900!"); closeMasterModal(); } else { showToast("❌ رمز المشرف غير صحيح!"); } } function changeCurrency(curr) { const tags = document.querySelectorAll(".curr-tag"); for (let i = 0; i < tags.length; i++) { tags[i].innerText = curr; } showToast("💱 تم التحويل إلى عملة: " + curr); } function changeLang(lang) { showToast("🌐 تم تغيير اللغة إلى: " + (lang === 'ar' ? 'العربية' : lang.toUpperCase())); } </script> </body> </html>
